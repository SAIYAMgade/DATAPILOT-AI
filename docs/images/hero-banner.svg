<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative Grid / Glow -->
  <circle cx="1050" cy="80" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Brand Icon -->
  <g transform="translate(60, 50)">
    <rect width="56" height="56" rx="14" fill="url(#accentGrad)" filter="url(#glow)"/>
    <path d="M18 38 L28 16 L38 38 Z M24 30 L32 30" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="22" r="3" fill="#ffffff"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="132" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    DataPilot <tspan fill="#38bdf8">AI</tspan>
  </text>
  <text x="134" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    ENTERPRISE ANALYTICS, CUSTOMER INTELLIGENCE &amp; DECISION INTELLIGENCE PLATFORM
  </text>

  <!-- Pill Badges -->
  <g transform="translate(60, 135)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#34d399"/>
    <text x="24" y="17" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">PostgreSQL 18</text>

    <!-- Badge 2 -->
    <rect x="130" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="142" cy="13" r="4" fill="#6366f1"/>
    <text x="154" y="17" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">FastAPI 1.0</text>

    <!-- Badge 3 -->
    <rect x="255" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="267" cy="13" r="4" fill="#38bdf8"/>
    <text x="279" y="17" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">React 19 TS</text>

    <!-- Badge 4 -->
    <rect x="370" y="0" width="145" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="382" cy="13" r="4" fill="#f59e0b"/>
    <text x="394" y="17" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">SciPy &amp; ML Lab</text>

    <!-- Badge 5 -->
    <rect x="525" y="0" width="165" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="537" cy="13" r="4" fill="#ec4899"/>
    <text x="549" y="17" font-family="monospace" font-size="11" fill="#cbd5e1" font-weight="600">Anti-Leakage Certified</text>
  </g>

  <!-- 4 Interactive Metric Cards -->
  <g transform="translate(60, 185)">
    <!-- Card 1: Revenue -->
    <g transform="translate(0, 0)">
      <rect width="255" height="185" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">NET TRANSACTION REVENUE</text>
      <text x="20" y="75" font-family="monospace" font-size="28" fill="#f8fafc" font-weight="700">$5,310,240</text>
      <rect x="20" y="92" width="70" height="20" rx="4" fill="#064e3b" opacity="0.6"/>
      <text x="27" y="106" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">+14.2% MoM</text>
      <path d="M 20 160 Q 60 145, 100 152 T 180 130 T 235 125" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <text x="20" y="172" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Verified non-refunded ledger</text>
    </g>

    <!-- Card 2: AOV -->
    <g transform="translate(275, 0)">
      <rect width="255" height="185" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">AVERAGE ORDER VALUE (AOV)</text>
      <text x="20" y="75" font-family="monospace" font-size="28" fill="#f8fafc" font-weight="700">$432.85</text>
      <text x="20" y="106" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="600">95% CI: [$426, $439]</text>
      <path d="M 20 155 Q 60 150, 100 140 T 180 145 T 235 135" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="20" y="172" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Student's t-distribution inference</text>
    </g>

    <!-- Card 3: Active Accounts -->
    <g transform="translate(550, 0)">
      <rect width="255" height="185" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">ACTIVE ACCOUNTS (30D)</text>
      <text x="20" y="75" font-family="monospace" font-size="28" fill="#f8fafc" font-weight="700">350 / 500</text>
      <text x="20" y="106" font-family="monospace" font-size="11" fill="#a78bfa" font-weight="600">70.0% Activity Rate</text>
      <!-- Mini Bar Sparkline -->
      <rect x="20" y="135" width="20" height="25" fill="#6366f1" rx="2"/>
      <rect x="48" y="130" width="20" height="30" fill="#6366f1" rx="2"/>
      <rect x="76" y="125" width="20" height="35" fill="#6366f1" rx="2"/>
      <rect x="104" y="120" width="20" height="40" fill="#818cf8" rx="2"/>
      <rect x="132" y="115" width="20" height="45" fill="#818cf8" rx="2"/>
      <text x="20" y="172" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Monthly rolling cohort activity</text>
    </g>

    <!-- Card 4: ML Churn Discrimination -->
    <g transform="translate(825, 0)">
      <rect width="255" height="185" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">CHURN MODEL DISCRIMINATION</text>
      <text x="20" y="75" font-family="monospace" font-size="28" fill="#f8fafc" font-weight="700">0.703 ROC</text>
      <rect x="20" y="92" width="130" height="20" rx="4" fill="#312e81" opacity="0.7"/>
      <text x="26" y="106" font-family="monospace" font-size="11" fill="#c7d2fe" font-weight="700">Zero Future Leakage</text>
      <circle cx="180" cy="140" r="16" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="75 25"/>
      <text x="172" y="144" font-family="monospace" font-size="10" fill="#f472b6" font-weight="700">PR</text>
      <text x="20" y="172" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Holdout evaluation on 60d cutoff</text>
    </g>
  </g>
</svg>
