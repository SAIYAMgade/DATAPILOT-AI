<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgModel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="680" height="340" rx="14" fill="url(#bgModel)" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
    Model Evaluation: ROC &amp; Precision-Recall Curves
  </text>
  <text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">
    Evaluated on temporal holdout test split (Zero future information leakage)
  </text>

  <!-- Legend -->
  <g transform="translate(420, 26)" font-family="monospace" font-size="11">
    <line x1="0" y1="8" x2="20" y2="8" stroke="#818cf8" stroke-width="2.5"/>
    <text x="26" y="12" fill="#c7d2fe">RandomForest (0.703)</text>
    <line x1="0" y1="26" x2="20" y2="26" stroke="#38bdf8" stroke-width="2"/>
    <text x="26" y="30" fill="#bae6fd">LogisticReg (0.648)</text>
    <line x1="0" y1="44" x2="20" y2="44" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="26" y="48" fill="#94a3b8">Baseline (0.500)</text>
  </g>

  <!-- Plot Area: x: 70 -> 340, y: 80 -> 280 (240 x 200) -->
  <!-- ROC Subplot -->
  <g transform="translate(60, 80)">
    <rect width="240" height="200" fill="#0b0f19" rx="6" stroke="#334155" stroke-width="1"/>

    <!-- Axis Labels -->
    <text x="120" y="228" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">False Positive Rate</text>
    <text x="-100" y="-12" font-family="sans-serif" font-size="10" fill="#94a3b8" transform="rotate(-90)" text-anchor="middle">True Positive Rate (Recall)</text>

    <!-- Grid -->
    <line x1="0" y1="50" x2="240" y2="50" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="100" x2="240" y2="100" stroke="#1e293b" stroke-width="1"/>
    <line x1="0" y1="150" x2="240" y2="150" stroke="#1e293b" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="200" stroke="#1e293b" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#1e293b" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="200" stroke="#1e293b" stroke-width="1"/>

    <!-- Baseline Diagonal -->
    <line x1="0" y1="200" x2="240" y2="0" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Logistic Regression Curve -->
    <path d="M 0 200 Q 40 110, 100 70 T 240 0" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Random Forest Curve (AUC 0.703) -->
    <path d="M 0 200 C 20 100, 60 50, 120 35 S 200 10, 240 0" fill="none" stroke="#818cf8" stroke-width="2.5"/>

    <!-- Selected Threshold Marker -->
    <circle cx="68" cy="46" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="78" y="44" font-family="monospace" font-size="9" fill="#fcd34d">Th=0.70</text>
  </g>

  <!-- Feature Importance Subplot -->
  <g transform="translate(360, 80)">
    <rect width="280" height="200" fill="#0b0f19" rx="6" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Top 5 Predictive Features (Gini)</text>

    <!-- Bars -->
    <!-- Feature 1: recency_days (0.334) -->
    <g transform="translate(14, 40)">
      <text x="0" y="10" font-family="monospace" font-size="10" fill="#cbd5e1">recency_days</text>
      <rect x="100" y="0" width="130" height="13" rx="3" fill="#818cf8"/>
      <text x="236" y="10" font-family="monospace" font-size="9" fill="#94a3b8">0.334</text>
    </g>

    <!-- Feature 2: velocity_ratio (0.246) -->
    <g transform="translate(14, 68)">
      <text x="0" y="10" font-family="monospace" font-size="10" fill="#cbd5e1">velocity_ratio</text>
      <rect x="100" y="0" width="96" height="13" rx="3" fill="#818cf8"/>
      <text x="202" y="10" font-family="monospace" font-size="9" fill="#94a3b8">0.246</text>
    </g>

    <!-- Feature 3: active_weeks (0.128) -->
    <g transform="translate(14, 96)">
      <text x="0" y="10" font-family="monospace" font-size="10" fill="#cbd5e1">active_weeks</text>
      <rect x="100" y="0" width="50" height="13" rx="3" fill="#6366f1"/>
      <text x="156" y="10" font-family="monospace" font-size="9" fill="#94a3b8">0.128</text>
    </g>

    <!-- Feature 4: frequency_obs (0.091) -->
    <g transform="translate(14, 124)">
      <text x="0" y="10" font-family="monospace" font-size="10" fill="#cbd5e1">frequency_obs</text>
      <rect x="100" y="0" width="36" height="13" rx="3" fill="#6366f1"/>
      <text x="142" y="10" font-family="monospace" font-size="9" fill="#94a3b8">0.091</text>
    </g>

    <!-- Feature 5: days_tenure (0.075) -->
    <g transform="translate(14, 152)">
      <text x="0" y="10" font-family="monospace" font-size="10" fill="#cbd5e1">days_tenure</text>
      <rect x="100" y="0" width="30" height="13" rx="3" fill="#4f46e5"/>
      <text x="136" y="10" font-family="monospace" font-size="9" fill="#94a3b8">0.075</text>
    </g>

    <text x="14" y="188" font-family="sans-serif" font-size="10" fill="#64748b">
      Permutation importance verified on holdout split
    </text>
  </g>
</svg>
