    <rect x="125" y="3" width="55" height="24" rx="4" fill="#065f46"/><text x="142" y="19" fill="#34d399" font-weight="600">100%</text>
    <rect x="195" y="3" width="55" height="24" rx="4" fill="#047857"/><text x="212" y="19" fill="#6ee7b7" font-weight="600">68.6%</text>
    <rect x="265" y="3" width="55" height="24" rx="4" fill="#064e3b"/><text x="282" y="19" fill="#a7f3d0" font-weight="600">52.9%</text>
    <rect x="335" y="3" width="55" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="358" y="19" fill="#64748b">—</text>
    <rect x="405" y="3" width="55" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="428" y="19" fill="#64748b">—</text>
