<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" rx="14" fill="url(#bgHeat)" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="25" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
    Customer Cohort Retention Matrix (Heatmap)
  </text>
  <text x="25" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">
    Active rate defined as ≥1 completed transaction in monthly period; future periods masked
  </text>

  <!-- Table Headers -->
  <g transform="translate(25, 75)" font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="0" y="15" font-weight="700">Cohort</text>
    <text x="75" y="15" font-weight="700">Size</text>
    <text x="135" y="15" font-weight="700">M+0</text>
    <text x="205" y="15" font-weight="700">M+1</text>
    <text x="275" y="15" font-weight="700">M+2</text>
    <text x="345" y="15" font-weight="700">M+3</text>
    <text x="415" y="15" font-weight="700">M+4</text>
    <text x="485" y="15" font-weight="700">M+5</text>
    <text x="555" y="15" font-weight="700">M+6</text>
    <text x="625" y="15" font-weight="700">Total Rev</text>
  </g>

  <!-- Divider -->
  <line x1="25" y1="98" x2="735" y2="98" stroke="#334155" stroke-width="1"/>

  <!-- Cohort Rows -->
