       100% -> #065f46 text #34d399
       70-80% -> #047857 text #6ee7b7
       50-69% -> #064e3b text #a7f3d0
       30-49% -> #1e3a8a text #93c5fd
       20-29% -> #312e81 text #c7d2fe
       masked -> #0f172a text #475569
  -->

  <!-- Row 1: 2025-01 -->
  <g transform="translate(25, 108)" font-family="monospace" font-size="11">
    <text x="0" y="20" fill="#f8fafc" font-weight="700">2025-01</text>
    <text x="75" y="20" fill="#94a3b8">48</text>
    <rect x="125" y="3" width="55" height="24" rx="4" fill="#065f46"/><text x="142" y="19" fill="#34d399" font-weight="600">100%</text>
    <rect x="195" y="3" width="55" height="24" rx="4" fill="#047857"/><text x="212" y="19" fill="#6ee7b7" font-weight="600">72.9%</text>
    <rect x="265" y="3" width="55" height="24" rx="4" fill="#064e3b"/><text x="282" y="19" fill="#a7f3d0" font-weight="600">64.5%</text>
    <rect x="335" y="3" width="55" height="24" rx="4" fill="#1e3a8a"/><text x="352" y="19" fill="#93c5fd" font-weight="600">47.9%</text>
    <rect x="405" y="3" width="55" height="24" rx="4" fill="#1e3a8a"/><text x="422" y="19" fill="#93c5fd" font-weight="600">41.6%</text>
    <rect x="475" y="3" width="55" height="24" rx="4" fill="#312e81"/><text x="492" y="19" fill="#c7d2fe" font-weight="600">37.5%</text>
    <rect x="545" y="3" width="55" height="24" rx="4" fill="#312e81"/><text x="562" y="19" fill="#c7d2fe" font-weight="600">33.3%</text>
    <text x="625" y="20" fill="#38bdf8" font-weight="600">$542k</text>
  </g>

