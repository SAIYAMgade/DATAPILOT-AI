  <!-- Legend Bottom -->
  <g transform="translate(25, 290)" font-family="monospace" font-size="10" fill="#94a3b8">
    <text x="0" y="12">Retention Intensity:</text>
    <rect x="130" y="2" width="14" height="12" rx="2" fill="#065f46"/><text x="150" y="12">&gt;80%</text>
    <rect x="200" y="2" width="14" height="12" rx="2" fill="#047857"/><text x="220" y="12">60-79%</text>
    <rect x="280" y="2" width="14" height="12" rx="2" fill="#064e3b"/><text x="300" y="12">50-59%</text>
    <rect x="360" y="2" width="14" height="12" rx="2" fill="#1e3a8a"/><text x="380" y="12">40-49%</text>
    <rect x="440" y="2" width="14" height="12" rx="2" fill="#312e81"/><text x="460" y="12">&lt;40%</text>
    <rect x="520" y="2" width="14" height="12" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="540" y="12">— Future window</text>
