name: DataPilot AI CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: datapilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install psutil

    - name: Run Alembic Database Migrations
      env:
        DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/datapilot_test
      run: |
        alembic upgrade head

    - name: Execute Full Test Suite
      env:
        TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/datapilot_test
        DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/datapilot_test
      run: |
        pytest -v tests

    - name: Run Reproducible Benchmark Suite
      env:
        DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/datapilot_test
      run: |
        python -m backend.app.benchmark

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Frontend TypeCheck & Production Build
      working-directory: ./frontend
      run: npm run build
